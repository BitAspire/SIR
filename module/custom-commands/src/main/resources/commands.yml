main: com.bitaspire.sir.module.custom.CustomCommands

commands:
  customcommands:
    permission: sir.customcommands.admin
    override-existing: true
    aliases: [ ccmd ]
    description: 'Manage the custom commands of SIR.'
    usage: '/customcommands [reload|list|create|toggle|rename|duplicate|delete|data|player-data] [<args>]'
